name: Render Remotion Video

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'result/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: |
          mkdir -p out
          npx remotion render Main out/video.mp4

      - name: Commit and Push to result folder
        run: |
          mkdir -p result
          cp out/video.mp4 result/video.mp4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result/video.mp4
          git commit -m "Add rendered video to result/ [skip ci]" || echo "No changes"
          git push
