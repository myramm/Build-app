name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Judul Video'
        required: false
        default: 'Hello Remotion'
      subtitle:
        description: 'Subjudul Video'
        required: false
        default: 'Rendered on GitHub Actions'

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: |
          mkdir -p out
          npx remotion render Main out/video.mp4 --props="{\"titleText\":\"${{ github.event.inputs.title || 'Hello Remotion' }}\",\"subtitleText\":\"${{ github.event.inputs.subtitle || 'Rendered on GitHub Actions' }}\"}"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
          retention-days: 7
