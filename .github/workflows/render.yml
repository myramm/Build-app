name: Render Remotion Video

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'remotion.config.ts'
      - 'package.json'
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID (e.g. GdpRace, Tutorial, Main)'
        required: false
        default: 'GdpRace'
      output_name:
        description: 'Output filename (e.g. gdp-economy-race-1950-2026.mp4, remotion-ai-tutorial.mp4, modern-warfare-documentary.mp4)'
        required: false
        default: 'gdp-economy-race-1950-2026.mp4'

permissions:
  contents: write

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: |
          mkdir -p out result
          COMP="${{ github.event.inputs.composition || 'GdpRace' }}"
          OUT_FILE="${{ github.event.inputs.output_name || 'gdp-economy-race-1950-2026.mp4' }}"
          echo "Rendering composition $COMP to out/$OUT_FILE..."
          npx remotion render "$COMP" "out/$OUT_FILE" --video-bitrate=16M

      - name: Commit and Push to result folder
        run: |
          OUT_FILE="${{ github.event.inputs.output_name || 'gdp-economy-race-1950-2026.mp4' }}"
          mkdir -p result/video
          cp "out/$OUT_FILE" "result/video/$OUT_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result/video/
          git commit -m "Auto render $OUT_FILE to result/video/ [skip ci]" || echo "No changes"
          git push

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video-result
          path: out/
          retention-days: 7
