name: Monthly GDP Dataset Update

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    name: Check & Sync World Bank / IMF GDP Revisions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Automated Dataset Updater
        run: |
          python3 scripts/update_gdp_dataset.py

      - name: Commit and Push Dataset Revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gdp/dataset.json src/gdp/dataset_revisions.log
          if git diff --staged --quiet; then
            echo "No dataset changes detected for this month."
          else
            echo "New macroeconomic revisions detected. Committing..."
            git commit -m "chore(data): automated monthly sync with World Bank & IMF WEO revisions [skip ci]"
            git push
          fi
