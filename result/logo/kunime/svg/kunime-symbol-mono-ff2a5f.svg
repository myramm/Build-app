<svg fill="#ff2a5f" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%"><title>Kunime Anime Streaming Logo</title>
  
  <defs>
    <linearGradient id="kunime-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#ff2a5f" />
    </linearGradient>
  </defs>

  <g id="kunime-symbol" transform="translate(121, 116)">
    <!-- Vertical Katana Backbone / Pillar -->
    <rect x="0" y="0" width="56" height="280" rx="16" fill="#FFFFFF" />

    <!-- Upper Katana Diagonal Slash -->
