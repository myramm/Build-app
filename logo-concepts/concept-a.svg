<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kunime-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A5F" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
  </defs>
  <!-- Background Dark Canvas -->
  <rect width="512" height="512" rx="96" fill="#090A10" />

  <!-- Geometric Symbol: Katana 'K' + Stream Play Arrow -->
  <g transform="translate(116, 116)">
    <!-- Vertical Pillar (Torii / Katana Backbone) -->
    <rect x="0" y="0" width="56" height="280" rx="14" fill="#FFFFFF" />

    <!-- Top Slash / Katana Strike -->
    <path d="M 96,168 L 220,32 C 228,24 240,30 240,42 L 240,104 C 240,112 234,120 226,126 L 148,188 Z" fill="url(#kunime-grad-a)" />

    <!-- Play Arrow & Bottom Leg (Media Play Integration) -->
    <path d="M 96,120 L 256,224 C 268,232 268,248 256,256 L 216,280 C 206,286 194,284 186,276 L 76,160 Z" fill="url(#kunime-grad-a)" />
    
    <!-- Dynamic Play Accent Needle -->
    <polygon points="120,100 230,180 120,220" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
